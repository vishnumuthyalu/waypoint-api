name: CI

on:
  push:
    branches: [main, v2-microservices]
  pull_request:

jobs:
  test-links:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: services/links }
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waypoint_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/waypoint_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/links/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx @stoplight/spectral-cli lint spec/openapi.yaml
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  check-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [redirect]
    defaults:
      run: { working-directory: "services/${{ matrix.service }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "services/${{ matrix.service }}/package-lock.json"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build