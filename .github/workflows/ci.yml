name: CI

on:
  push:
    branches: [main, v2-microservices]
  pull_request:

permissions:
  contents: write    # bump-deploy commits to the repo
  packages: write    # images push to GHCR

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-links:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: services/links }
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waypoint_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/waypoint_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/links/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx @stoplight/spectral-cli lint spec/openapi.yaml
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  check-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [redirect, analytics, bff]
    defaults:
      run: { working-directory: "services/${{ matrix.service }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "services/${{ matrix.service }}/package-lock.json"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  images:
    if: github.event_name == 'push'
    needs: [test-links, check-services]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [links, redirect, analytics, bff]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ghcr.io/vishnumuthyalu/waypoint-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  bump-deploy:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: imranismail/setup-kustomize@v2
      - name: Point the local overlay at the new images
        working-directory: deploy/overlays/local
        run: |
          for s in links redirect analytics bff; do
            kustomize edit set image ghcr.io/vishnumuthyalu/waypoint-$s=ghcr.io/vishnumuthyalu/waypoint-$s:${GITHUB_SHA}
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): images ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase
          git push