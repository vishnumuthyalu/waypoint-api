name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx @stoplight/spectral-cli lint spec/openapi.yaml
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build