apiVersion: apps/v1
kind: Deployment
metadata:
  name: links
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  replicas: 2
  selector: { matchLabels: { app: links } }
  template:
    metadata: { labels: { app: links } }
    spec:
      containers:
        - name: links
          image: ghcr.io/vishnumuthyalu/waypoint-links
          ports: [{ containerPort: 3000 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: waypoint-db, key: url } }
            - { name: REDIS_URL, value: "redis://redis:6379" }
          readinessProbe: { httpGet: { path: /readyz, port: 3000 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 3000 }, periodSeconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: links
spec:
  selector: { app: links }
  ports: [{ port: 3000 }]