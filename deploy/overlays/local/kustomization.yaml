apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - { name: ghcr.io/vishnumuthyalu/waypoint-links, newTag: dev }
  - { name: ghcr.io/vishnumuthyalu/waypoint-redirect, newTag: dev }
  - { name: ghcr.io/vishnumuthyalu/waypoint-analytics, newTag: dev }
  - { name: ghcr.io/vishnumuthyalu/waypoint-bff, newTag: dev }
  
patches:
  - target: { kind: Deployment, name: redirect }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3